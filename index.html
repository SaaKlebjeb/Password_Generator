<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Strong Password Generator</title>
    <!-- Tailwind CSS for modern, responsive styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
     <!-- ijjg5g5ig5i0og0it9i95 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom transitions */
        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 200ms;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 selection:bg-indigo-500 selection:text-white">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden p-6 sm:p-8">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-indigo-600/20 text-indigo-400 mb-3 border border-indigo-500/30">
                <i class="fa-solid fa-shield-halved text-xl"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-white">Password Generator</h1>
            <p class="text-xs sm:text-sm text-slate-400 mt-1">Create secure, randomized passwords instantly</p>
        </div>

        <!-- Password Display Box -->
        <div class="relative mb-6">
            <div class="flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl px-4 py-3.5 focus-within:border-indigo-500 transition-all shadow-inner">
                <span id="passwordOutput" class="font-mono text-lg sm:text-xl tracking-wider text-slate-300 break-all select-all mr-2">Click Generate</span>
                <button id="copyBtn" onclick="copyPassword()" title="Copy to Clipboard" class="flex-shrink-0 text-slate-400 hover:text-indigo-400 p-2 rounded-lg hover:bg-slate-800 transition-all relative">
                    <i class="fa-regular fa-copy text-lg"></i>
                </button>
            </div>
            <!-- Copy Feedback Tooltip -->
            <div id="copyTooltip" class="absolute right-0 -top-8 bg-indigo-600 text-white text-xs px-2.5 py-1 rounded-md opacity-0 pointer-events-none transition-all shadow-md font-medium">
                Copied!
            </div>
        </div>

        <!-- Password Strength Meter -->
        <div class="mb-6 bg-slate-950/60 p-3.5 rounded-xl border border-slate-800/80">
            <div class="flex justify-between items-center mb-1.5">
                <span class="text-xs font-medium text-slate-400 uppercase tracking-wider">Security Strength</span>
                <span id="strengthText" class="text-xs font-semibold text-slate-500">Not Evaluated</span>
            </div>
            <div class="grid grid-cols-3 gap-1.5 h-1.5 w-full">
                <div id="strengthBar1" class="bg-slate-800 rounded-full transition-all"></div>
                <div id="strengthBar2" class="bg-slate-800 rounded-full transition-all"></div>
                <div id="strengthBar3" class="bg-slate-800 rounded-full transition-all"></div>
            </div>
        </div>

        <!-- Configuration Options -->
        <div class="space-y-5">
            
            <!-- Length Option (8 or 12 digits) -->
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2.5">Password Length</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="cursor-pointer">
                        <input type="radio" name="length" value="8" class="peer sr-only">
                        <div class="text-center py-2.5 px-4 rounded-xl border border-slate-800 bg-slate-950/50 text-slate-300 font-medium text-sm peer-checked:bg-indigo-600 peer-checked:border-indigo-500 peer-checked:text-white transition-all hover:border-slate-700">
                            8 Digits
                        </div>
                    </label>
                    <label class="cursor-pointer">
                        <input type="radio" name="length" value="12" checked class="peer sr-only">
                        <div class="text-center py-2.5 px-4 rounded-xl border border-slate-800 bg-slate-950/50 text-slate-300 font-medium text-sm peer-checked:bg-indigo-600 peer-checked:border-indigo-500 peer-checked:text-white transition-all hover:border-slate-700">
                            12 Digits
                        </div>
                    </label>
                </div>
            </div>

            <!-- Character Checkboxes -->
            <div class="space-y-3 pt-2">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Character Inclusion</label>
                
                <!-- Uppercase -->
                <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950/40 border border-slate-800/80 cursor-pointer hover:border-slate-700 transition-all">
                    <span class="text-sm font-medium text-slate-300">Uppercase Letters (A-Z)</span>
                    <input type="checkbox" id="includeUppercase" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer">
                </label>

                <!-- Lowercase -->
                <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950/40 border border-slate-800/80 cursor-pointer hover:border-slate-700 transition-all">
                    <span class="text-sm font-medium text-slate-300">Lowercase Letters (a-z)</span>
                    <input type="checkbox" id="includeLowercase" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer">
                </label>

                <!-- Numbers -->
                <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950/40 border border-slate-800/80 cursor-pointer hover:border-slate-700 transition-all">
                    <span class="text-sm font-medium text-slate-300">Numbers (0-9)</span>
                    <input type="checkbox" id="includeNumbers" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer">
                </label>

                <!-- Symbols -->
                <label class="flex items-center justify-between p-3 rounded-xl bg-slate-950/40 border border-slate-800/80 cursor-pointer hover:border-slate-700 transition-all">
                    <span class="text-sm font-medium text-slate-300">Symbols (@#$%)</span>
                    <input type="checkbox" id="includeSymbols" checked class="w-4 h-4 rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer">
                </label>
            </div>

        </div>

        <!-- Generate Button -->
        <div class="mt-6">
            <button onclick="generatePassword()" class="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all active:scale-[0.99] flex items-center justify-center space-x-2">
                <i class="fa-solid fa-rotate text-sm"></i>
                <span>Generate Password</span>
            </button>
        </div>
       

        <!-- Custom Notification Message Box (replaces alert) -->
        <div id="notificationBox" class="fixed bottom-6 right-6 bg-slate-800 border border-slate-700 text-slate-200 px-4 py-3 rounded-xl shadow-2xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center space-x-3 z-50">
            <i id="notificationIcon" class="fa-solid fa-circle-exclamation text-amber-400"></i>
            <span id="notificationMessage" class="text-sm font-medium">Notification message here</span>
        </div>

    </div>

    <!-- JavaScript Application Logic -->
    <script>
        // Character pools
        const UPPERCASE_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
        const LOWERCASE_CHARS = 'abcdefghijklmnopqrstuvwxyz';
        const NUMBER_CHARS = '0123456789';
        const SYMBOL_CHARS = '@#$%&*?!';

        // Show custom notification message box instead of alert()
        function showNotification(message, type = 'info') {
            const box = document.getElementById('notificationBox');
            const text = document.getElementById('notificationMessage');
            const icon = document.getElementById('notificationIcon');

            text.textContent = message;
            if (type === 'error') {
                icon.className = 'fa-solid fa-circle-exclamation text-rose-400';
            } else {
                icon.className = 'fa-solid fa-circle-check text-indigo-400';
            }

            box.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                box.classList.add('translate-y-20', 'opacity-0');
            }, 3000);
        }

        // Generate Password Main Function
        function generatePassword() {
            // Get selected length
            const lengthRadio = document.querySelector('input[name="length"]:checked');
            const length = lengthRadio ? parseInt(lengthRadio.value) : 12;

            // Get checkboxes
            const includeUpper = document.getElementById('includeUppercase').checked;
            const includeLower = document.getElementById('includeLowercase').checked;
            const includeNum = document.getElementById('includeNumbers').checked;
            const includeSym = document.getElementById('includeSymbols').checked;

            // Validate at least one option is chosen
            if (!includeUpper && !includeLower && !includeNum && !includeSym) {
                showNotification('Please select at least one character type!', 'error');
                return;
            }

            let validChars = '';
            if (includeUpper) validChars += UPPERCASE_CHARS;
            if (includeLower) validChars += LOWERCASE_CHARS;
            if (includeNum) validChars += NUMBER_CHARS;
            if (includeSym) validChars += SYMBOL_CHARS;

            // Generate secure pseudo-random characters using window.crypto
            let password = '';
            const array = new Uint32Array(length);
            window.crypto.getRandomValues(array);

            for (let i = 0; i < length; i++) {
                const randomIndex = array[i] % validChars.length;
                password += validChars[randomIndex];
            }

            // Output password
            const outputElement = document.getElementById('passwordOutput');
            outputElement.textContent = password;
            outputElement.classList.remove('text-slate-500');
            outputElement.classList.add('text-white');

            // Evaluate Strength
            evaluateStrength(password, includeUpper, includeLower, includeNum, includeSym, length);
        }

        // Password Strength Evaluation
        function evaluateStrength(password, upper, lower, num, sym, length) {
            let score = 0;
            
            // Count active criteria
            let criteriaCount = (upper ? 1 : 0) + (lower ? 1 : 0) + (num ? 1 : 0) + (sym ? 1 : 0);

            if (length >= 12) score++;
            if (criteriaCount >= 3) score++;
            if (criteriaCount === 4 && length >= 12) score++;

            const bar1 = document.getElementById('strengthBar1');
            const bar2 = document.getElementById('strengthBar2');
            const bar3 = document.getElementById('strengthBar3');
            const text = document.getElementById('strengthText');

            // Reset bars
            bar1.className = 'bg-slate-800 rounded-full transition-all';
            bar2.className = 'bg-slate-800 rounded-full transition-all';
            bar3.className = 'bg-slate-800 rounded-full transition-all';

            if (length === 8 && criteriaCount <= 2) {
                bar1.className = 'bg-rose-500 rounded-full transition-all';
                text.textContent = 'Weak';
                text.className = 'text-xs font-semibold text-rose-400';
            } else if (score === 1 || criteriaCount === 3) {
                bar1.className = 'bg-amber-500 rounded-full transition-all';
                bar2.className = 'bg-amber-500 rounded-full transition-all';
                text.textContent = 'Medium';
                text.className = 'text-xs font-semibold text-amber-400';
            } else {
                bar1.className = 'bg-emerald-500 rounded-full transition-all';
                bar2.className = 'bg-emerald-500 rounded-full transition-all';
                bar3.className = 'bg-emerald-500 rounded-full transition-all';
                text.textContent = 'Strong';
                text.className = 'text-xs font-semibold text-emerald-400';
            }
        }

        // Copy Password to Clipboard safely
        function copyPassword() {
            const passwordText = document.getElementById('passwordOutput').textContent;
            
            if (passwordText === 'Click Generate' || !passwordText) {
                showNotification('No password generated yet!', 'error');
                return;
            }

            // Using document.execCommand for safe iframe compatibility
            const textarea = document.createElement('textarea');
            textarea.value = passwordText;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showTooltip();
            } catch (err) {
                showNotification('Failed to copy password', 'error');
            }
            document.body.removeChild(textarea);
        }

        // Tooltip feedback animation
        function showTooltip() {
            const tooltip = document.getElementById('copyTooltip');
            tooltip.classList.remove('opacity-0', '-top-8');
            tooltip.classList.add('opacity-100', '-top-10');
            setTimeout(() => {
                tooltip.classList.remove('opacity-100', '-top-10');
                tooltip.classList.add('opacity-0', '-top-8');
            }, 1500);
        }

        // Auto-generate on first load
        window.onload = function() {
            generatePassword();
        };
    </script>
</body>
</html>
